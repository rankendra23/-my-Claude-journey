<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Marketing Detective</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#06100c;--bg2:#0c1d16;--ac:#2bff9a;--ac2:#13b86b;--paper:#e9e2cf;--ink:#2a2a22;--cork:#6b4a2b;--tx:#d8efe4;--red:#ff5a5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% 0,#0f2b20,var(--bg) 60%);color:var(--tx);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:18px}
h1,h2,h3{margin:0 0 8px;letter-spacing:.5px}h1{font-size:clamp(30px,6vw,56px);color:var(--ac);text-shadow:0 0 24px #2bff9a77}
.mono{font-family:'Courier New',monospace}
.screen{animation:in .6s ease both}@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.btn{background:linear-gradient(var(--ac),var(--ac2));color:#022;border:0;padding:12px 22px;border-radius:8px;font:700 15px 'Courier New',monospace;cursor:pointer;box-shadow:0 0 18px #2bff9a55;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px #2bff9a99}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac);box-shadow:none}
.prog{display:flex;gap:6px;margin-bottom:14px}.prog i{flex:1;height:5px;border-radius:3px;background:#1b3a2e}.prog i.on{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.folder{background:var(--paper);color:var(--ink);border-radius:4px 14px 6px 6px;padding:22px;position:relative;box-shadow:0 14px 40px #000a;background-image:repeating-linear-gradient(0deg,#0000 0 27px,#0001 27px 28px)}
.folder:before{content:"";position:absolute;top:-14px;left:0;width:140px;height:16px;background:var(--paper);border-radius:8px 8px 0 0}
.stamp{position:absolute;top:14px;right:14px;border:3px solid var(--red);color:var(--red);padding:2px 10px;transform:rotate(8deg);font:700 14px 'Courier New',monospace;opacity:.8}
.board{background:var(--cork) repeating-radial-gradient(circle at 30% 40%,#0000 0 3px,#0002 3px 4px);border:10px solid #3b2714;border-radius:10px;padding:18px;box-shadow:inset 0 0 50px #000a,0 0 30px #000;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.note{background:#f5e66b;color:var(--ink);padding:16px 12px 12px;position:relative;box-shadow:3px 6px 12px #0007;transform:rotate(var(--r,-1deg));transition:.25s;font:14px/1.4 'Courier New',monospace}
.note:nth-child(2n){background:#a9f0c8;--r:1.4deg}.note:nth-child(3n){background:#f7c7a3;--r:-1.8deg}
.note:hover{transform:rotate(0) scale(1.04);z-index:3}
.pin{position:absolute;top:-7px;left:50%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a9a,#c00);box-shadow:2px 3px 4px #0008;transform:translateX(-50%)}
.ev{cursor:grab;user-select:none}.ev:active{cursor:grabbing}.ev.used{opacity:.3;pointer-events:none}
.ev .t{font-weight:700;margin-bottom:4px}
.locker{border:2px dashed var(--ac);border-radius:12px;padding:12px;min-height:120px;background:#0a1f17;transition:.2s}.locker.over{background:#123a2a;box-shadow:0 0 24px #2bff9a66}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.slot{min-height:84px;border:1px solid #2bff9a44;border-radius:8px;padding:8px;font:13px 'Courier New',monospace;cursor:pointer}
.slot.f{background:var(--paper);color:var(--ink);border-color:var(--ac)}
.stat{background:#0d241a;border:1px solid #2bff9a44;border-radius:10px;padding:10px;font-family:'Courier New',monospace}
.stat b{display:block;font-size:22px;color:var(--ac)}.bar{height:6px;background:#1b3a2e;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width 1.4s ease}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:8px;border:1px solid #2bff9a55;background:#0d241a;color:var(--tx);font:15px Georgia,serif;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--ac);transform:translateX(6px);box-shadow:0 0 14px #2bff9a44}.opt.sel{background:#14452f;border-color:var(--ac)}
.big{font:700 clamp(40px,10vw,90px) 'Courier New',monospace;color:var(--red);border:8px solid var(--red);display:inline-block;padding:6px 24px;transform:rotate(-8deg);animation:slam .7s cubic-bezier(.2,2,.4,1) both;text-shadow:0 0 20px #f006}
@keyframes slam{from{transform:rotate(-8deg) scale(4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.center{text-align:center}.small{font-size:13px;opacity:.8}.ok{color:var(--ac)}.no{color:var(--red)}
ul{padding-left:20px;line-height:1.6}
</style></head><body><div id="app"></div>
<script>
"use strict";
const C=[
{n:"Verdant Bites",ind:"Plant-based meal kits",obj:"Win 5,000 trial subscribers in 8 weeks",aud:"Urban working parents, 28-40, time-poor",ch:["TV","Instagram","Display ads"],bud:{TV:60,Instagram:25,"Display ads":15},m:[2400000,0.4,1.1,0.2,"$38K"],cm:["\"Never saw an ad, my feed is all reels.\"","\"Cool concept but where do I sign up?\""],so:"Instagram posts got 90 likes each; 3 comments in total.",mis:"Put 60% of budget on TV while the audience lives on mobile.",cl:["Target parents report 4+ hours daily on phones, under 1 hour on TV.","Instagram, where the audience lives, got only 25% of spend.","Comments say people never saw the ad."],ex:"The channel mix didn't match audience behaviour. Money went where the audience wasn't, so reach was wide but irrelevant.",imp:["Move 50% of budget to mobile-first video","Retarget site visitors","Test creators over TV spots"]},
{n:"Nimbus Sneakers",ind:"Footwear / D2C",obj:"Launch the AirLite shoe to Gen Z",aud:"Students 16-24, trend-driven",ch:["TikTok","Influencers","Email"],bud:{TikTok:30,Influencers:55,Email:15},m:[1800000,3.1,6.4,0.3,"$22K"],cm:["\"Love the vibe, but $190?? no way.\"","\"Influencer made it look amazing, price killed it.\""],so:"Videos went viral: 1.2M views, thousands of shares.",mis:"Priced the product far above what the audience can pay.",cl:["High engagement but only 0.3% conversion.","Comments keep mentioning the price.","Competitors sell similar shoes at roughly half the price."],ex:"Attention was won, but the offer didn't fit a student wallet, so interest never became sales.",imp:["Introduce an entry-level colourway","Student discount codes","Instalment payments"]},
{n:"PayLeaf",ind:"Fintech app",obj:"Grow active users in tier-2 cities",aud:"First-time digital payers, 35-55",ch:["English YouTube","LinkedIn","Search"],bud:{"English YouTube":40,LinkedIn:35,Search:25},m:[900000,0.7,0.9,0.4,"$9K"],cm:["\"I didn't understand the ad.\"","\"Is there a Hindi version?\""],so:"LinkedIn posts reached office professionals, not the target group.",mis:"Ran English-only, corporate-toned ads for a regional-language audience.",cl:["Target region speaks mostly local languages.","LinkedIn skews to a different demographic.","Users ask for local-language support."],ex:"Message and platform ignored language and context of the target audience.",imp:["Localise creative in 4 languages","Use WhatsApp and local video","Add agent-assisted onboarding"]},
{n:"BrewHaus Coffee",ind:"Cafe chain",obj:"Boost weekday footfall by 20%",aud:"Office workers near 12 outlets",ch:["Billboards","Radio","App coupons"],bud:{Billboards:50,Radio:30,"App coupons":20},m:[1200000,1.2,2.0,0.5,"$14K"],cm:["\"Never knew you had a 2-for-1 deal.\"","\"Coupon app crashed twice.\""],so:"Posts are pretty but have no call to action.",mis:"Zero measurement or clear call-to-action, so awareness never became visits.",cl:["Billboards had no offer, QR or address.","Coupon app crashed during lunch rush.","No tracking compared outlets near ads vs far."],ex:"Without a clear action and tracking, awareness couldn't be turned into measurable footfall.",imp:["Add QR codes with time-limited offers","Fix app stability","Track redemptions per outlet"]},
{n:"Zenith Fitness",ind:"Gym franchise",obj:"Sell 800 annual memberships in January",aud:"Adults 25-45 with fitness goals",ch:["Instagram","Flyers","Google Ads"],bud:{Instagram:35,Flyers:15,"Google Ads":50},m:[700000,2.8,3.2,0.6,"$41K"],cm:["\"Joined, but the free trial sign-up form was broken.\"","\"Site slow on my phone.\""],so:"Good engagement; many DMs asking about price.",mis:"Sent interested traffic to a slow, broken landing page.",cl:["CTR is healthy at 2.8%.","Conversions only 0.6%: a big drop after the click.","Customers report form errors and slow loading."],ex:"The ads worked; the destination failed. The leak was in the funnel after the click.",imp:["Rebuild a fast mobile landing page","Add WhatsApp lead capture","A/B test the form"]},
{n:"Little Sprout Toys",ind:"Educational toys",obj:"Build holiday-season brand awareness",aud:"Parents of kids 3-7",ch:["Facebook","Influencers","Email"],bud:{Facebook:45,Influencers:35,Email:20},m:[1500000,1.5,2.4,1.9,"$30K"],cm:["\"Arrived late and the box was damaged.\"","\"Kids love it, shipping was awful.\""],so:"Positive launch buzz, then a wave of 1-star delivery posts.",mis:"Drove a demand spike without securing fulfilment capacity.",cl:["Reviews turn negative after week 2.","Complaints are about delivery, not product.","Ad spend increased while stock ran low."],ex:"Marketing outran operations. The campaign promised what logistics couldn't deliver, damaging reputation.",imp:["Sync campaign pacing with stock","Add delivery-time messaging","Partner with a second courier"]},
{n:"Aurora Skincare",ind:"Beauty",obj:"Reposition as a premium dermatologist-grade brand",aud:"Women 30-50, skincare-aware",ch:["Magazines","Instagram","Discount sites"],bud:{Magazines:30,Instagram:30,"Discount sites":40},m:[1000000,1.0,1.6,1.1,"$19K"],cm:["\"Thought you were a budget brand.\"","\"Why is it 70% off everywhere?\""],so:"Mixed tone: luxury photos next to flash-sale banners.",mis:"Sent mixed messages: premium positioning with heavy discounting.",cl:["40% of budget went to discount sites.","Comments question the brand's quality.","Creative alternates between luxury and clearance."],ex:"Brand positioning was undermined by tactics that signalled low value.",imp:["Stop blanket discounts","Use expert-led content","Offer value-adds, not price cuts"]},
{n:"QuickShift Logistics",ind:"B2B delivery software",obj:"Generate 300 qualified demo requests",aud:"Operations heads at mid-size retailers",ch:["TikTok","Memes","Cold email"],bud:{TikTok:50,Memes:20,"Cold email":30},m:[3000000,0.9,8.1,0.05,"$3K"],cm:["\"Funny, but not my buying decision.\"","\"Who is this even for?\""],so:"Meme videos went viral with teenagers.",mis:"Chased viral reach on the wrong platform for a B2B buyer.",cl:["Huge engagement, near-zero demos.","Most viewers are under 24.","Decision-makers weren't reached."],ex:"Vanity metrics hid a wrong-audience problem. Viral reach meant nothing for B2B leads.",imp:["Use LinkedIn and industry events","Publish case studies","Measure demo requests, not views"]},
{n:"Sunrise Travels",ind:"Online travel agency",obj:"Fill off-season packages",aud:"Retirees and couples 50+",ch:["Search ads","Newsletter","Podcasts"],bud:{"Search ads":50,Newsletter:25,Podcasts:25},m:[600000,2.2,2.9,0.8,"$26K"],cm:["\"Booking page too complicated.\"","\"I called three times, no answer.\""],so:"Few social posts; audience isn't there.",mis:"Offered no simple human booking path for an audience that wants assistance.",cl:["Audience prefers phone/agent help.","Customers call and don't get answers.","Online-only booking drops 70% of carts."],ex:"The campaign ignored how the audience prefers to buy. Friction at the booking step killed conversions.",imp:["Add call-back booking","Simplify the checkout","Staff phone support during campaigns"]},
{n:"PixelPlay Games",ind:"Mobile gaming",obj:"Get 100K installs for a puzzle game",aud:"Casual gamers 18-35",ch:["Ad networks","Influencers","App store"],bud:{"Ad networks":60,Influencers:20,"App store":20},m:[4000000,2.5,1.0,0.1,"$5K"],cm:["\"Uninstalled after 2 minutes, too many ads.\"","\"Ad showed a different game!\""],so:"Installs high, ratings dropping fast.",mis:"Ad creatives misrepresented the game, so users installed then churned.",cl:["High installs but 1-day retention under 10%.","Reviews say 'not like the ad'.","Rating falls after paid burst."],ex:"Misleading creatives attracted the wrong expectations, producing installs without lasting users.",imp:["Use real gameplay footage","Optimise for retention, not installs","Respond to reviews quickly"]}
];
let cur,ev,locker,pick,step,seen=[];
const A=document.getElementById('app');
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':n;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const prog=s=>'<div class="prog">'+[0,1,2,3,4,5].map(i=>'<i class="'+(i<=s?'on':'')+'"></i>').join('')+'</div>';
function home(){step=0;A.innerHTML='<div class="screen center" style="padding-top:8vh">'+prog(-1)+'<p class="mono small">THE AGENCY • CONFIDENTIAL</p><h1>MARKETING DETECTIVE</h1><p>Campaigns fail for a reason. Someone left clues.<br>Find the one fatal mistake before the client walks.</p><br><button class="btn" onclick="start()">▶ OPEN A NEW CASE</button><p class="small mono">'+C.length+' cases on file</p></div>'}
function start(){let pool=C.filter(c=>!seen.includes(c.n));if(!pool.length){seen=[];pool=C}cur=pool[Math.floor(Math.random()*pool.length)];seen.push(cur.n);locker=[];pick=null;
const id=C.indexOf(cur)+1;step=0;
A.innerHTML='<div class="screen">'+prog(0)+'<div class="folder"><div class="stamp">TOP SECRET</div><p class="mono small">CASE FILE #'+String(id).padStart(3,'0')+'</p><h2>The strange case of '+cur.n+'</h2><p><b>Industry:</b> '+cur.ind+'</p><p><b>Campaign objective:</b> '+cur.obj+'</p><p><b>Client says:</b> "We spent the budget. The numbers look busy. But something is off. Find out what."</p><p class="mono small">Your task: gather 3 pieces of evidence, then name the primary marketing mistake.</p><button class="btn" onclick="board()">OPEN INVESTIGATION BOARD →</button></div></div>'}
function board(){step=1;const m=cur.m;
const st=(l,v,p)=>'<div class="stat">'+l+'<b>'+v+'</b>'+(p!=null?'<div class="bar"><i data-w="'+Math.min(100,p)+'"></i></div>':'')+'</div>';
const bud=Object.entries(cur.bud).map(([k,v])=>'<div class="mono small">'+k+' – '+v+'%<div class="bar"><i data-w="'+v+'"></i></div></div>').join('');
A.innerHTML='<div class="screen">'+prog(1)+'<h2>Investigation Board</h2><p class="small">Study the board. Hover the notes. Then continue to collect evidence.</p><div class="board"><div class="grid">'+
'<div class="note"><span class="pin"></span><b>TARGET AUDIENCE</b><br>'+cur.aud+'</div>'+
'<div class="note"><span class="pin"></span><b>CHANNELS</b><br>'+cur.ch.join(' • ')+'</div>'+
'<div class="note"><span class="pin"></span><b>BUDGET SPLIT</b><br>'+bud+'</div>'+
'<div class="note"><span class="pin"></span><b>CUSTOMER SAYS</b><br>'+cur.cm.join('<br>')+'</div>'+
'<div class="note"><span class="pin"></span><b>SOCIAL MEDIA</b><br>'+cur.so+'</div></div></div>'+
'<div class="grid">'+st('Reach',fmt(m[0]),m[0]/4e4)+st('CTR',m[1]+'%',m[1]*20)+st('Engagement',m[2]+'%',m[2]*10)+st('Conversions',m[3]+'%',m[3]*40)+st('Sales',m[4],null)+'</div><br><button class="btn" onclick="invest()">COLLECT EVIDENCE →</button></div>';
setTimeout(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'),80)}
function invest(){step=2;
const d=[{t:"Audience profile",x:"Target: "+cur.aud+"."},{t:"Campaign objective",x:"Goal: "+cur.obj+"."},{t:"Budget sheet",x:"Spend: "+Object.entries(cur.bud).map(e=>e[0]+" "+e[1]+"%").join(", ")+"."},{t:"Channel list",x:"Used: "+cur.ch.join(", ")+"."}];
const real=cur.cl.map((x,i)=>({t:"Sealed envelope "+String.fromCharCode(65+i),x,r:1}));
ev=shuf(real.concat(shuf(d).slice(0,2).map(o=>({t:o.t,x:o.x,r:0}))));ev.forEach((e,i)=>e.id=i);locker=[];drawInv()}
function drawInv(){
A.innerHTML='<div class="screen">'+prog(2)+'<h2>Evidence Desk</h2><p class="small">Drag 3 pieces of evidence into the locker (or tap them). Not everything is useful. Choose the ones that explain the failure.</p><div class="board"><div class="grid">'+
ev.map(e=>'<div class="note ev'+(locker.includes(e.id)?' used':'')+'" draggable="true" ondragstart="event.dataTransfer.setData(\'t\','+e.id+')" onclick="add('+e.id+')"><span class="pin"></span><div class="t">'+e.t+'</div>'+(locker.includes(e.id)?'':'<span class="small">Drag me to the locker</span>')+'</div>').join('')+'</div></div>'+
'<h3>Evidence Locker ('+locker.length+'/3)</h3><div class="locker" id="lk" ondragover="event.preventDefault();this.classList.add(\'over\')" ondragleave="this.classList.remove(\'over\')" ondrop="event.preventDefault();add(+event.dataTransfer.getData(\'t\'))"><div class="slots">'+
[0,1,2].map(i=>{const e=ev.find(o=>o.id===locker[i]);return e?'<div class="slot f" onclick="rem('+e.id+')"><b>'+e.t+'</b><br>'+e.x+'</div>':'<div class="slot">Empty slot</div>'}).join('')+'</div></div><br><button class="btn" '+(locker.length<3?'disabled':'')+' onclick="solve()">SOLVE THE CASE →</button></div>'}
function add(i){if(locker.length<3&&!locker.includes(i)){locker.push(i);drawInv()}}
function rem(i){locker=locker.filter(x=>x!==i);drawInv()}
function solve(){step=3;const opts=shuf([cur.mis].concat(shuf(C.filter(c=>c!==cur)).slice(0,3).map(c=>c.mis)));
A.innerHTML='<div class="screen">'+prog(3)+'<h2>Solve the Case</h2><div class="folder"><p>Based on your evidence, what was the <b>primary marketing mistake</b> at '+cur.n+'?</p>'+opts.map((o,i)=>'<button class="opt" data-o="'+i+'" onclick="sel(this)">'+o+'</button>').join('')+'<button class="btn" id="sub" disabled onclick="submit()">⚖ SUBMIT VERDICT</button></div></div>';window._o=opts}
function sel(b){document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick=window._o[+b.dataset.o];document.getElementById('sub').disabled=false}
function submit(){step=4;const ok=pick===cur.mis;
A.innerHTML='<div class="screen center" style="padding-top:8vh">'+prog(4)+(ok?'<div class="big">CASE CLOSED</div><p>Brilliant work, detective.</p>':'<div class="big">UNSOLVED</div><p>Not quite. The file is still open...</p>')+'<br><button class="btn" onclick="report()">VIEW LEARNING REPORT →</button></div>'}
function report(){step=5;const ok=pick===cur.mis;const found=ev.filter(e=>e.r&&locker.includes(e.id)).length;const sc=(ok?55:0)+found*15;
const rank=sc>=90?'Chief Inspector':sc>=60?'Senior Detective':sc>=30?'Rookie':'Trainee';
A.innerHTML='<div class="screen">'+prog(5)+'<div class="folder"><div class="stamp">'+(ok?'SOLVED':'REVIEW')+'</div><h2>Learning Report: '+cur.n+'</h2><p class="mono"><b>Score:</b> '+sc+'/100 • <b>Rank:</b> '+rank+'</p><p><b>Primary mistake:</b> '+cur.mis+'</p><p><b>Your verdict:</b> <span class="'+(ok?'ok':'no')+'">'+(ok?'Correct':'Incorrect')+'</span></p><p><b>Evidence you collected:</b> '+found+' of 3 real clues</p><h3>Supporting clues</h3><ul>'+cur.cl.map(c=>'<li>'+c+'</li>').join('')+'</ul><h3>Explanation</h3><p>'+cur.ex+'</p><h3>Suggested improvements</h3><ul>'+cur.imp.map(c=>'<li>'+c+'</li>').join('')+'</ul><button class="btn" onclick="start()">▶ NEW RANDOM CASE</button> <button class="btn ghost" onclick="home()">HOME</button></div></div>'}
home();
</script></body></html>
