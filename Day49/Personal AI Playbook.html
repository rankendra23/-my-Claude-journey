<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Personal AI Playbook</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14162b;--mut:#636784;--bd:#e3e5f0;--ac:#5b5bf0;--acs:#ececff;--ok:#16a34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f1a;--card:#171829;--tx:#eceefb;--mut:#9a9dbd;--bd:#2a2c45;--ac:#8b8bff;--acs:#23244a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f1a;--card:#171829;--tx:#eceefb;--mut:#9a9dbd;--bd:#2a2c45;--ac:#8b8bff;--acs:#23244a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;transition:background .3s}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:17px;letter-spacing:-.3px;margin-right:8px}.logo b{color:var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;color:var(--mut);padding:7px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--acs);color:var(--ac)}.sp{flex:1}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{border:1px solid var(--bd);background:var(--card);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s}.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}:root[data-theme="dark"] .btn.p{color:#0e0f1a}
.btn.s{padding:4px 9px;font-size:12px}
main{max-width:1150px;margin:0 auto;padding:22px 20px 60px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1{margin:0 0 2px;font-size:26px;letter-spacing:-.5px}h2{font-size:16px;margin:0 0 8px}.sub{color:var(--mut);margin:0 0 18px}
.banner{display:flex;gap:12px;background:var(--acs);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:20px;font-size:14px}.banner div{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;transition:.2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card:hover{box-shadow:0 6px 24px rgba(80,80,160,.12)}
.tag{display:inline-block;background:var(--acs);color:var(--ac);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.stat b{display:block;font-size:28px;color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut);font-size:13px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px}textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}@media(max-width:860px){.cols{grid-template-columns:1fr}}
.sticky{position:sticky;top:76px;align-self:start}
.pv{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:12px;font:13px/1.55 ui-monospace,Menlo,monospace;max-height:60vh;overflow:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:16px}.pick .card{padding:10px;font-size:13px}
.blk{border-left:4px solid var(--ac);margin-bottom:10px}.why{font-size:12.5px;color:var(--mut);margin:2px 0 6px}
.ov{position:fixed;inset:0;background:rgba(10,10,30,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:20;overflow:auto}.ov.on{display:flex}
.md{background:var(--card);border-radius:16px;max-width:760px;width:100%;padding:22px;border:1px solid var(--bd);animation:in .25s}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.on{opacity:1}
kbd{background:var(--acs);border-radius:5px;padding:1px 6px;font-size:12px}
.empty{text-align:center;padding:36px;color:var(--mut)}
</style></head><body>
<header><div class="logo">Personal <b>AI Playbook</b></div>
<nav id="nav"></nav><div class="sp"></div>
<button class="btn" data-act="help">? What is this?</button><button class="btn" data-act="theme" title="Toggle dark mode (T)">◐ Theme</button><button class="btn" data-act="exp">Export</button><button class="btn" data-act="imp">Import</button></header>
<main id="m"></main><div class="ov" id="ov"><div class="md" id="md"></div></div><div class="toast" id="t"></div>
<script>
const SEED=[
{title:"Concept Explainer",cat:"Learning",desc:"Turn any confusing topic into a clear lesson with an analogy, example and self-check.",tpl:"You are a patient CS tutor. Explain {{concept}} to a {{audience}}.\n\nStructure:\n1. One-sentence plain-English definition\n2. An everyday analogy\n3. Step-by-step walkthrough with a small {{language}} example\n4. Three common misconceptions\n5. Two check questions (answers at the very end)\n\nKeep it under {{length}} words.",vars:{concept:"recursion",audience:"first-year engineering student",language:"Python",length:"400"},tip:"Name your level honestly. Ask a follow-up like “explain step 3 again with a different example”.",ex:"Concept: pointers in C → get an analogy (house addresses), code, and 2 quiz questions."},
{title:"Study Notes Maker",cat:"Learning",desc:"Convert lecture text or slides into exam-ready notes plus flashcards.",tpl:"Turn the material below into exam-ready study notes on {{topic}}.\n\nFormat: key ideas (max 7 bullets), a definitions table, one worked example, patterns to memorize, and 5 flashcards (Q/A).\nThen explain the topic back to me in simple words (Feynman style) and point out what I should double-check.\n\nMATERIAL:\n{{material}}",vars:{topic:"Operating Systems: scheduling",material:"(paste your notes here)"},tip:"Paste real notes. The AI organizes them instead of inventing content.",ex:"Paste 2 pages on CPU scheduling → get a table of FCFS/SJF/RR plus flashcards."},
{title:"Exam Quizzer",cat:"Learning",desc:"An adaptive one-question-at-a-time quiz that finds your weak spots.",tpl:"Quiz me on {{topic}} for {{exam}}. Ask one question at a time, starting at {{difficulty}} level and adapting to my answers.\nAfter each answer: say right or wrong, explain why in 2 sentences, then ask the next question.\nAfter {{count}} questions, summarize my weak spots and give a 3-day revision plan.",vars:{topic:"Data Structures",exam:"semester exam",difficulty:"medium",count:"10"},tip:"Answer in your own words first. Active recall beats rereading.",ex:"Topic: trees → questions on traversal, BST, balancing, then a revision plan."},
{title:"Explain This Code",cat:"Learning",desc:"Understand unfamiliar code line by line and learn the pattern behind it.",tpl:"Explain the following {{language}} code line by line for a {{level}}.\nThen give: what it does overall, time and space complexity, one bug or improvement, and a similar practice exercise.\n\nCODE:\n{{code}}",vars:{language:"Python",level:"beginner",code:"(paste code)"},tip:"Ask for the practice exercise and solve it before reading the answer.",ex:"Paste a BFS function → line-by-line explanation, O(V+E), practice problem."},
{title:"Stack Trace Debugger",cat:"Debugging",desc:"Read an error, find the root cause, get the smallest fix and learn why.",tpl:"Act as a debugging specialist for {{language}}.\n\nERROR / STACK TRACE:\n{{error}}\n\nRELEVANT CODE:\n{{code}}\n\nEnvironment: {{env}}\n\nDo this in order:\n1. Explain in plain English what the error means\n2. Identify the root cause and point to the exact line\n3. Give the smallest fix as a diff\n4. Explain why it works so I learn it\n5. Tell me how to prevent this class of bug",vars:{language:"Python",error:"(paste full error)",code:"(paste the failing code)",env:"Python 3.11, Windows"},tip:"Always paste the FULL error and your environment. Missing context is the #1 cause of wrong fixes.",ex:"ModuleNotFoundError + your import lines → cause is a wrong virtual environment."},
{title:"Runs-First-Time Code Generator",cat:"Building",desc:"Generate code with built-in self-checks so it runs without fixes.",tpl:"Write {{task}} in {{language}} ({{version}}).\n\nRequirements:\n- Must run as-is: no missing imports, no placeholders\n- Allowed dependencies: {{deps}}\n- Include a tiny example run with expected output\n\nBefore answering, silently check: every import exists, every function is defined, edge cases ({{edge}}) are handled, and mentally execute the example.\nAfter the code, list the exact commands to install and run it, plus any assumptions you made.",vars:{task:"a CLI to-do app",language:"Python",version:"3.11",deps:"standard library only",edge:"empty input, duplicates"},tip:"State versions and allowed libraries. Then paste any error back using the Stack Trace Debugger.",ex:"Task: CSV cleaner → code, run command, expected output, assumptions."},
{title:"Project Scaffolder",cat:"Building",desc:"Get folders, starter files and a step-by-step build roadmap for a new project.",tpl:"Scaffold a {{type}} project called {{name}} using {{stack}}.\n\nGive me: folder structure, every starter file with working boilerplate, a README with setup and run steps, and a .gitignore.\nThen give a 5-step build roadmap where each step ends with something I can run and test.\nKeep it beginner-friendly and explain each file in one line.",vars:{type:"web app",name:"study-planner",stack:"HTML, CSS and JavaScript"},tip:"Build one roadmap step at a time and test before moving on.",ex:"Flask API → tree, app.py, requirements.txt, README, 5 testable steps."}];
const BL={pb:[
["role","Role","Tells the AI who to act as, so it uses the right expertise and vocabulary.",["Patient CS tutor who teaches beginners with analogies","Senior software engineer who writes production-quality code","Debugging specialist who finds root causes","Exam coach for engineering students"]],
["objective","Objective","States the single job to do. A clear goal prevents vague answers.",["Explain the concept so I can teach it back","Write working code for the task below","Find and fix the bug below","Create a study plan and practice questions"]],
["context","Context","Background the AI cannot guess: your level, tools, versions, deadline.",["I am a beginner engineering student learning this for the first time","I am building a small project in Python 3 on Windows","I have an exam in one week on this topic"]],
["constraints","Constraints","Hard limits and rules. They stop the AI from adding things you did not want.",["Use only the standard library; no placeholders; code must run as-is","Keep it under 400 words; define any jargon","Do not invent facts; say when unsure"]],
["reasoning","Reasoning strategy","Controls how the AI thinks before answering. Planning first gives fewer mistakes.",["Think step by step before answering","Plan first, solve, then verify against the requirements","Compare two approaches, pick the best and explain why"]],
["format","Output format","Decides the shape of the answer so you can use it immediately.",["Numbered steps, then a code block, then a short summary","Markdown with headings, bullets and a table where useful","Short answer first, details after"]],
["tone","Tone","Sets the voice. Matters for learning: encouraging or Socratic styles teach better.",["Friendly and encouraging, plain English","Direct and concise","Socratic: ask me guiding questions before giving answers"]],
["examples","Examples","Show one sample of good output. AI copies patterns far better than descriptions.",["Example input: ... → Example output: ... (replace with yours)","Imitate this answer style: ..."]],
["checks","Quality checks","Self-review steps run before replying. The main fix for code that breaks.",["Before replying, verify imports, syntax and edge cases by mentally running the code","Re-read my request and confirm every requirement is met","End with 3 quiz questions to test my understanding"]]],
lb:[
["base","Task prompt","The normal prompt you want to run in a loop. Paste it or import it from the Prompt Builder.",["Write a Python function for the task and make it fully correct","Explain the concept clearly for a beginner"]],
["goal","Goal","What “finished” looks like. The loop needs a target, or it never knows when to stop.",["Code that runs with no errors and passes all examples","An explanation a beginner can repeat back correctly"]],
["eval","Evaluation criteria","How each attempt is scored. This is how the AI judges its own work honestly.",["Score 1-10 on: correctness, runs as-is, edge cases, clarity","Score 1-10 on: accuracy, simplicity, examples, completeness"]],
["improve","Improvement strategy","What to change between rounds, so each loop gets better instead of just different.",["Fix the lowest-scoring criterion first; change one thing at a time","Critique like a strict reviewer, then rewrite only the weak parts"]],
["stop","Stop conditions","When to end. Prevents endless loops and wasted effort.",["Stop when every score is 9 or higher, or after 5 iterations","Stop when two rounds in a row show no improvement"]],
["safety","Safety rules","Boundaries the loop must never cross, such as inventing facts or deleting things.",["Never invent facts, libraries or results; say when unsure","Do not run destructive commands; ask me before any irreversible step"]]]};
const KEY="pb_v1",V=[["dash","Dashboard"],["wf","Workflows"],["pb","Prompt Builder"],["lb","Loop Builder"]];
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.wf)S={wf:SEED.map((w,i)=>({...w,id:"s"+i,fav:i==4})),dismissed:false,theme:"auto",seen:false,b:{pb:{act:["role","objective","context","format","checks"],val:{}},lb:{act:["base","goal","eval","improve","stop","safety"],val:{}}}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let view="dash",W=null,F={q:"",c:"",f:false};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vars=t=>[...new Set([...t.matchAll(/\{\{(\w+)\}\}/g)].map(m=>m[1]))];
const fill=(t,v)=>t.replace(/\{\{(\w+)\}\}/g,(m,k)=>v[k]?.trim()?v[k]:m);
const cats=()=>[...new Set(S.wf.map(w=>w.cat))];
function toast(m){const t=$("#t");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function copy(txt){const d=()=>toast("Copied to clipboard");try{navigator.clipboard.writeText(txt).then(d,fb)}catch(e){fb()}function fb(){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");d()}catch(e){toast("Copy failed: select and copy manually")}a.remove()}}
function theme(){const r=document.documentElement;S.theme=="auto"?r.removeAttribute("data-theme"):r.dataset.theme=S.theme}
function modal(h){$("#md").innerHTML=h;$("#ov").classList.add("on")}function closeM(){$("#ov").classList.remove("on");W=null}
function nav(){$("#nav").innerHTML=V.map(([k,n],i)=>`<button class="${k==view?"on":""}" data-act="go" data-v="${k}" title="Key ${i+1}">${n}</button>`).join("")}
function go(v){view=v;render()}
function render(){nav();$("#m").innerHTML=(S.dismissed?"":`<div class="banner"><div><b>What is this?</b> Personal AI Playbook turns the prompts you reuse into saved, fill-in-the-blank <b>workflows</b>, so you stop retyping and get better AI answers. <b>Dashboard</b> = overview. <b>Workflows</b> = your saved prompt templates. <b>Prompt Builder</b> = assemble a prompt from labelled blocks. <b>Loop Builder</b> = turn a prompt into a self-improving loop.</div><button class="btn s" data-act="dis">Dismiss ✕</button></div>`)+({dash,wf,pb:()=>bld("pb"),lb:()=>bld("lb")})[view]();if(view=="wf")grid();if(view=="pb"||view=="lb")pv(view)}
function dash(){const f=S.wf.filter(w=>w.fav);return`<h1>Dashboard</h1><p class="sub">Your saved AI prompt workflows, at a glance. Built for a CS student who is new to prompting and wants faster, deeper learning.</p>
<div class="stats"><div class="card stat"><b>${S.wf.length}</b>saved workflows</div><div class="card stat"><b>${f.length}</b>favorites</div><div class="card stat"><b>${cats().length}</b>categories</div></div>
<div class="grid"><div class="card"><h2>Start here: 3 steps</h2><ol style="padding-left:18px;margin:0"><li><a href="#" data-act="go" data-v="wf">Open a workflow</a>, fill the blanks, copy it into any AI (Claude, ChatGPT, Gemini).</li><li>Use the <a href="#" data-act="go" data-v="pb">Prompt Builder</a> when no workflow fits your task.</li><li>Use the <a href="#" data-act="go" data-v="lb">Loop Builder</a> so the AI checks and fixes its own code before you see it.</li></ol></div>
<div class="card"><h2>Why AI code breaks first time</h2><p class="mut" style="margin:0">Usually the AI lacks your versions, libraries or the full error, and never tests its own answer. Fix: state the environment, require self-checks (Quality checks block), and loop until the criteria pass.</p></div>
<div class="card"><h2>Favorites</h2>${f.length?f.map(w=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${esc(w.title)}</span><button class="btn s" data-act="open" data-id="${w.id}">Open</button></div>`).join(""):'<p class="mut">No favorites yet. Star a workflow in the Workflows section.</p>'}</div></div>`}
function wf(){return`<h1>Workflows</h1><p class="sub">Reusable prompt templates with fill-in variables. Open one, fill the blanks, copy.</p><div class="row" style="margin-bottom:14px"><div style="flex:2;min-width:180px"><input id="q" placeholder="Search workflows ( / )" value="${esc(F.q)}"></div><div style="flex:1;min-width:140px"><select id="fc"><option value="">All categories</option>${cats().map(c=>`<option ${F.c==c?"selected":""}>${esc(c)}</option>`).join("")}</select></div><button class="btn ${F.f?"p":""}" data-act="ff">★ Favorites</button><button class="btn p" data-act="new">+ New workflow (N)</button></div><div id="g"></div>`}
function grid(){const q=F.q.toLowerCase(),l=S.wf.filter(w=>(!F.c||w.cat==F.c)&&(!F.f||w.fav)&&(w.title+w.desc+w.tpl).toLowerCase().includes(q));$("#g").innerHTML=l.length?`<div class="grid">${l.map(w=>`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">${esc(w.cat)}</span><button class="btn s" data-act="fav" data-id="${w.id}">${w.fav?"★":"☆"}</button></div><h2 style="margin-top:8px">${esc(w.title)}</h2><p class="mut">${esc(w.desc)}</p><div class="row"><button class="btn p s" data-act="open" data-id="${w.id}">Open</button><button class="btn s" data-act="edit" data-id="${w.id}">Edit</button><button class="btn s" data-act="dup" data-id="${w.id}">Duplicate</button><button class="btn s" data-act="del" data-id="${w.id}">Delete</button></div></div>`).join("")}</div>`:`<div class="empty">No workflows match. Clear the filters or create your own with “New workflow”.</div>`}
const MT={Generic:"",Claude:"Think through this step by step before answering.",ChatGPT:"Reason step by step, then give a clear final answer.",Gemini:"Reason step by step and state any assumptions."};
function openW(id){const w=S.wf.find(x=>x.id==id);W={w,v:{...w.vars},m:"Generic"};const vs=vars(w.tpl);
modal(`<div class="row" style="justify-content:space-between"><h1 style="font-size:22px">${esc(w.title)}</h1><button class="btn s" data-act="close">Close ✕</button></div><p class="sub" style="margin-bottom:6px">${esc(w.desc)}</p><label>Target AI model</label><select data-wm>${Object.keys(MT).map(k=>`<option>${k}</option>`).join("")}</select>${vs.map(k=>`<label>${k.replace(/_/g," ")}</label><${/code|error|material/.test(k)?"textarea":"input"} data-wv="${k}" ${/code|error|material/.test(k)?"":`value="${esc(W.v[k]||"")}"`}>${/code|error|material/.test(k)?esc(W.v[k]||"")+"</textarea>":""}`).join("")}<label>Ready-to-copy prompt</label><div class="pv" id="wp"></div><div class="row" style="margin:10px 0"><button class="btn p" data-act="cpw">Copy prompt</button></div><p class="mut"><b>Best practice:</b> ${esc(w.tip||"")}<br><b>Example:</b> ${esc(w.ex||"")}</p>`);wpv()}
function wpv(){$("#wp").textContent=(MT[W.m]?MT[W.m]+"\n\n":"")+fill(W.w.tpl,W.v)}
function edit(id){const w=id?S.wf.find(x=>x.id==id):{title:"",cat:"Learning",desc:"",tpl:"",tip:"",ex:""};
modal(`<h1 style="font-size:22px">${id?"Edit":"New"} workflow</h1><p class="sub">Write the prompt and wrap each changeable part like {{this_variable}}. Each one becomes a fill-in field.</p><label>Title</label><input id="e1" value="${esc(w.title)}"><label>Category</label><input id="e2" list="cl" value="${esc(w.cat)}"><datalist id="cl">${cats().map(c=>`<option>${esc(c)}</option>`).join("")}</datalist><label>Short description</label><input id="e3" value="${esc(w.desc)}"><label>Prompt template</label><textarea id="e4" style="min-height:170px">${esc(w.tpl)}</textarea><label>Best practice tip</label><input id="e5" value="${esc(w.tip)}"><label>Example</label><input id="e6" value="${esc(w.ex)}"><div class="row" style="margin-top:14px"><button class="btn p" data-act="sv" data-id="${id||""}">Save</button><button class="btn" data-act="close">Cancel</button></div>`)}
function bld(k){const lb=k=="lb",B=S.b[k];return`<h1>${lb?"Loop Builder":"Prompt Builder"}</h1><p class="sub">${lb?"Turn a normal prompt into an autonomous loop: the AI produces, scores itself, improves and stops on your rules.":"Assemble a strong prompt from labelled building blocks and watch the result update live."}</p><div class="cols"><div><h2>1. Pick blocks <span class="mut">(each card explains what it does)</span></h2><div class="pick">${BL[k].map(b=>`<div class="card"><b>${b[1]}</b><div class="why">${b[2]}</div>${B.act.includes(b[0])?'<span class="tag">Added ✓</span>':`<button class="btn s" data-act="add" data-k="${k}" data-id="${b[0]}">+ Add</button>`}</div>`).join("")}</div><h2>2. Fill blocks <span class="mut">(choose a preset or type your own)</span></h2>${BL[k].filter(b=>B.act.includes(b[0])).map(b=>`<div class="card blk"><div class="row" style="justify-content:space-between"><b>${b[1]}</b><button class="btn s" data-act="rm" data-k="${k}" data-id="${b[0]}">Remove</button></div><div class="why">${b[2]}</div><select data-ps="${k}|${b[0]}"><option value="">Choose a preset…</option>${b[3].map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join("")}</select><textarea style="margin-top:6px" id="t_${k}_${b[0]}" data-bv="${k}|${b[0]}">${esc(B.val[b[0]]||"")}</textarea></div>`).join("")||'<div class="empty">No blocks yet. Add one above.</div>'}</div>
<div class="sticky"><h2>3. Live preview</h2><div class="pv" id="pv"></div><div class="row" style="margin-top:10px"><button class="btn p" data-act="cpb" data-k="${k}">Copy</button><button class="btn" data-act="sb" data-k="${k}">Save as workflow</button>${lb?'<button class="btn" data-act="imp2">Import from Prompt Builder</button>':""}</div></div></div>`}
function comp(k){const B=S.b[k],g=id=>(B.val[id]||"").trim(),a=id=>B.act.includes(id)&&g(id);
if(k=="pb")return BL.pb.filter(b=>a(b[0])).map(b=>b[1].toUpperCase()+":\n"+g(b[0])).join("\n\n")||"Add and fill blocks to see your prompt here.";
const n=B.act.includes("stop")&&g("stop");
return`You will work in an autonomous improvement loop.\n\nTASK:\n${g("base")||"(add your task prompt)"}\n\n${a("goal")?"GOAL (what done looks like):\n"+g("goal")+"\n\n":""}EACH ITERATION:\n1. PRODUCE the best attempt at the task.\n2. EVALUATE it${a("eval")?" against the criteria below":""}. Give scores and list every failure honestly.\n3. IMPROVE${a("improve")?" using the strategy below":""} and produce a new version.\n4. Repeat.\n\n${a("eval")?"EVALUATION CRITERIA:\n"+g("eval")+"\n\n":""}${a("improve")?"IMPROVEMENT STRATEGY:\n"+g("improve")+"\n\n":""}${n?"STOP CONDITIONS:\n"+g("stop")+"\n\n":"STOP CONDITIONS:\nStop after 5 iterations.\n\n"}${a("safety")?"SAFETY RULES:\n"+g("safety")+"\n\n":""}FINAL OUTPUT: the best version, a short log of each iteration's scores, and any remaining weaknesses.`}
function pv(k){const e=$("#pv");if(e)e.textContent=comp(k)}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id,k=el.dataset.k;if(el.tagName=="A")e.preventDefault();
if(a=="go")go(el.dataset.v);else if(a=="help")help();else if(a=="theme"){S.theme=S.theme=="dark"?"light":"dark";theme();save()}
else if(a=="dis"){S.dismissed=true;save();render()}else if(a=="close")closeM();else if(a=="ff"){F.f=!F.f;render()}else if(a=="new")edit();
else if(a=="open")openW(id);else if(a=="edit")edit(id);
else if(a=="fav"){const w=S.wf.find(x=>x.id==id);w.fav=!w.fav;save();view=="wf"?grid():render()}
else if(a=="dup"){const w=S.wf.find(x=>x.id==id);S.wf.push({...w,vars:{...w.vars},id:"u"+Date.now(),title:w.title+" (copy)"});save();grid();toast("Duplicated")}
else if(a=="del"){if(confirm("Delete this workflow?")){S.wf=S.wf.filter(x=>x.id!=id);save();render()}}
else if(a=="sv"){const t=$("#e4").value,o=id&&S.wf.find(x=>x.id==id),v={};vars(t).forEach(n=>v[n]=o?.vars?.[n]||"");const d={title:$("#e1").value||"Untitled",cat:$("#e2").value||"General",desc:$("#e3").value,tpl:t,tip:$("#e5").value,ex:$("#e6").value,vars:v};o?Object.assign(o,d):S.wf.push({...d,id:"u"+Date.now(),fav:false});save();closeM();render()}
else if(a=="cpw")copy($("#wp").textContent);
else if(a=="add"){S.b[k].act.push(id);save();render()}else if(a=="rm"){S.b[k].act=S.b[k].act.filter(x=>x!=id);save();render()}
else if(a=="cpb")copy(comp(k));
else if(a=="sb"){S.wf.push({id:"u"+Date.now(),title:k=="pb"?"My built prompt":"My loop prompt",cat:"My workflows",desc:"Saved from the "+(k=="pb"?"Prompt Builder":"Loop Builder"),tpl:comp(k),vars:{},tip:"Edit the text and add {{variables}} to make it reusable.",ex:"",fav:false});save();toast("Saved to Workflows")}
else if(a=="imp2"){S.b.lb.val.base=comp("pb");if(!S.b.lb.act.includes("base"))S.b.lb.act.unshift("base");save();render();toast("Imported")}
else if(a=="exp"){modal(`<h1 style="font-size:22px">Export</h1><p class="sub">Copy this JSON and keep it safe. Use Import to restore it.</p><textarea id="ex" style="min-height:240px" readonly>${esc(JSON.stringify(S.wf))}</textarea><div class="row" style="margin-top:10px"><button class="btn p" onclick="copy($('#ex').value)">Copy JSON</button><button class="btn" data-act="close">Close</button></div>`)}
else if(a=="imp"){modal(`<h1 style="font-size:22px">Import</h1><p class="sub">Paste exported workflow JSON. Imported items are added to your list.</p><textarea id="ix" style="min-height:240px"></textarea><div class="row" style="margin-top:10px"><button class="btn p" data-act="doimp">Import</button><button class="btn" data-act="close">Close</button></div>`)}
else if(a=="doimp"){try{const l=JSON.parse($("#ix").value);if(!Array.isArray(l))throw 0;l.forEach((w,i)=>S.wf.push({vars:{},fav:false,cat:"Imported",desc:"",tip:"",ex:"",...w,id:"i"+Date.now()+i}));save();closeM();render();toast("Imported "+l.length)}catch(x){toast("Invalid JSON")}}});
document.addEventListener("input",e=>{const t=e.target;if(t.id=="q"){F.q=t.value;grid()}else if(t.dataset.wv){W.v[t.dataset.wv]=t.value;wpv()}else if(t.dataset.bv){const[k,id]=t.dataset.bv.split("|");S.b[k].val[id]=t.value;save();pv(k)}});
document.addEventListener("change",e=>{const t=e.target;if(t.id=="fc"){F.c=t.value;grid()}else if(t.hasAttribute("data-wm")){W.m=t.value;wpv()}else if(t.dataset.ps&&t.value!==""){const[k,id]=t.dataset.ps.split("|"),o=BL[k].find(b=>b[0]==id)[3][+t.value],ta=$("#t_"+k+"_"+id);ta.value=o;S.b[k].val[id]=o;save();pv(k)}});
function help(){S.seen=true;save();modal(`<div class="row" style="justify-content:space-between"><h1 style="font-size:22px">What is the Personal AI Playbook?</h1><button class="btn s" data-act="close">Close ✕</button></div><p>It is a workspace for building <b>reusable AI systems</b> instead of retyping prompts. You save prompt templates with fill-in blanks, build new prompts from blocks, and convert prompts into loops where the AI checks its own work. It works with any AI model.</p><p><b>Dashboard</b>: overview and where to start.<br><b>Workflows</b>: your saved templates. Search, favorite, edit, duplicate, copy.<br><b>Prompt Builder</b>: pick blocks (role, objective, constraints…), each explained, and see the prompt live.<br><b>Loop Builder</b>: wrap any prompt with a goal, scoring, improvement and stop rules so it iterates until good.</p><p class="mut">Everything is saved in your browser only. Use Export to back up.</p><p><b>Shortcuts:</b> <kbd>1</kbd>–<kbd>4</kbd> sections · <kbd>/</kbd> search · <kbd>N</kbd> new workflow · <kbd>T</kbd> dark mode · <kbd>?</kbd> this help · <kbd>Esc</kbd> close</p><button class="btn p" data-act="close">Got it</button>`)}
document.addEventListener("keydown",e=>{if(e.key=="Escape")return closeM();if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey)return;const k=e.key;
if(k=="?")help();else if(k=="/"){e.preventDefault();go("wf");$("#q").focus()}else if(k=="n")edit();else if(k=="t"){S.theme=S.theme=="dark"?"light":"dark";theme();save()}else if("1234".includes(k)&&k)go(V[+k-1][0])});
theme();render();if(!S.seen)help();
</script></body></html>
