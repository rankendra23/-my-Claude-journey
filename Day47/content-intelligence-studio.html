<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Intelligence Studio</title>
<style>
:root{--bg:#17131f;--sf:#221c2e;--sf2:#2c2539;--tx:#f1ecf7;--mu:#a79fb8;--ac:#ff5d8f;--ok:#3ddbc0;--wa:#ffb454;--bd:#3a3250;color-scheme:dark}
:root[data-t=light]{--bg:#f6f3fa;--sf:#fff;--sf2:#eee9f5;--tx:#1d1727;--mu:#6b6379;--ac:#d6336c;--ok:#0f9d84;--wa:#c27a0c;--bd:#ddd5ea;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;margin:0;font-weight:600;letter-spacing:-.01em}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--bd)}
header h1{font-size:24px}header p{margin:0;color:var(--mu);font-size:13px}
button,select{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;border-radius:999px;padding:11px 24px}
button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:22px;display:grid;gap:22px}
.row{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}@media(max-width:860px){.row{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px}
.card h3{font-size:18px;margin-bottom:10px}label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
textarea{width:100%;min-height:130px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer}.drop:hover{border-color:var(--ac)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.th{width:112px}.th img{width:100%;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.th select{width:100%;padding:4px;font-size:12px;margin-top:4px}.th button{width:100%;padding:2px;font-size:12px;margin-top:3px}
.chips{display:grid;gap:8px}.chip{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--sf2);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none}.chip.run .dot{background:var(--wa);animation:pu 1s infinite}.chip.ok .dot{background:var(--ok)}.chip.err .dot{background:var(--ac)}
.chip small{margin-left:auto;color:var(--mu)}@keyframes pu{50%{opacity:.25}}
#log{height:150px;overflow:auto;background:var(--bg);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--mu);margin-top:12px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}@media(max-width:620px){.hero{grid-template-columns:1fr}}
.ring{--v:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--v)*1%),var(--sf2) 0);display:grid;place-items:center;transition:--v 1s}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font:600 38px Georgia,serif}
.bar{margin:9px 0}.bar span{display:flex;justify-content:space-between;font-size:13px}.bar i{display:block;height:8px;border-radius:5px;background:var(--sf2);margin-top:4px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ok));border-radius:5px;transition:width 1s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card ul{margin:0;padding-left:18px}.card li{margin:4px 0}.card p{margin:6px 0;white-space:pre-wrap}
.good{border-left:4px solid var(--ok)}.bad{border-left:4px solid var(--wa)}.hi{border-left:4px solid var(--ac)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.ba{grid-template-columns:1fr}}
.ba>div{background:var(--bg);border-radius:10px;padding:12px;white-space:pre-wrap}
.note{font-size:12px;color:var(--mu)}.err{color:var(--ac)}.hid{display:none}
.pr{display:block;width:100%;text-align:left;margin:6px 0}
.ck{display:flex;gap:8px;margin:5px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div><h1>Content Intelligence Studio</h1><p>Instagram authority review, powered by live Claude analysis</p></div>
<div><select id="tone" aria-label="Review tone"><option>Gentle</option><option>Balanced</option><option>Strict</option><option>Brutal</option></select> <button id="tg" aria-label="Toggle theme">Theme</button></div></header>
<main>
<div class="row">
<section class="card"><h3>Your content</h3>
<label for="cap">Caption (and any notes, hashtags, or analytics numbers)</label><textarea id="cap" placeholder="Paste your Instagram caption here"></textarea>
<label for="an">Analytics or context (optional)</label><textarea id="an" style="min-height:70px" placeholder="Reach, saves, audience, niche, past results..."></textarea>
<label>Images: post, carousel slides, thumbnails, analytics screenshots</label>
<div class="drop" id="drop" tabindex="0" role="button">Click to add images (up to 6)</div><input id="file" type="file" accept="image/*" multiple class="hid">
<div class="thumbs" id="thumbs"></div>
<p style="margin-top:16px"><button class="p" id="go">Run analysis</button> <button id="retry" class="hid">Retry failed reviewers</button></p><p class="note" id="msg"></p></section>
<section class="card"><h3>Review pipeline</h3><div class="chips" id="chips"></div><div id="log" aria-live="polite"></div></section></div>
<div id="out" class="hid"></div>
</main>
<script>
"use strict";
var API="https://api.anthropic.com/v1/messages",MODEL="claude-sonnet-4-6";
var $=function(i){return document.getElementById(i)};
var imgs=[],res={},busy=false;
var FMT="\nOutput rules: plain text only, never JSON. Put each label alone at the start of a line followed by a colon, in capitals, exactly as listed. Use lines starting with '- ' for lists. Be specific to this exact content, quote its words where useful, and stay under 450 words.";
var CTX="You are part of a review panel for an Instagram post whose creator wants to build authority and a personal brand. ";
var REV=[
{id:"hook",n:"Hook & Attention Analyst",c:"Hook strength",s:CTX+"You judge the first line, scroll-stopping power, curiosity, clarity and pacing of the caption. Labels: SCORE (0-100 number only), REASONING, STRENGTHS, WEAKNESSES, MISSED OPPORTUNITIES, RECOMMENDATIONS."},
{id:"auth",n:"Authority & Brand Strategist",c:"Authority & credibility",s:CTX+"You judge expertise signals, proof, point of view, consistency of personal brand, trust and positioning. Labels: SCORE (0-100 number only), REASONING, STRENGTHS, WEAKNESSES, MISSED OPPORTUNITIES, RECOMMENDATIONS."},
{id:"alg",n:"Instagram Algorithm Specialist",c:"Platform fit",s:CTX+"You judge fit with current Instagram behavior: saves and shares triggers, caption length, hashtags, CTA, formatting, carousel or Reel suitability, accessibility, posting tactics. Labels: SCORE (0-100 number only), REASONING, STRENGTHS, WEAKNESSES, MISSED OPPORTUNITIES, RECOMMENDATIONS (platform-specific)."},
{id:"vis",n:"Visual Design Critic",c:"Visual impact",img:1,s:CTX+"You examine the attached images directly: composition, legibility on mobile, color, hierarchy, brand consistency, text on image, carousel flow. If analytics screenshots are present, read the numbers and interpret them. Labels: SCORE (0-100 number only), REASONING, STRENGTHS, WEAKNESSES, MISSED OPPORTUNITIES, RECOMMENDATIONS."}];
var SEC=["SCORE","REASONING","STRENGTHS","WEAKNESSES","MISSED OPPORTUNITIES","RECOMMENDATIONS","REWRITTEN CAPTION","ALTERNATIVE HOOKS","ALTERNATIVE TITLES","CHECKLIST","OVERALL SCORE","EXECUTIVE SUMMARY","HEALTH REPORT","TOP IMPROVEMENTS","PREDICTED PERFORMANCE","BEFORE VS AFTER","FOLLOW-UP PROMPTS"];
var STAGE2=[
{id:"rew",n:"Copy Rewriter",s:CTX+"You rewrite the content to be stronger while keeping the creator's voice. Labels: REWRITTEN CAPTION (full ready-to-post caption), ALTERNATIVE HOOKS (5 first lines), ALTERNATIVE TITLES (5 carousel or cover titles)."}];
var STAGE3=[
{id:"sumA",n:"Chief Strategist",s:CTX+"You synthesize the panel's findings. Labels: OVERALL SCORE (0-100 number only), EXECUTIVE SUMMARY, HEALTH REPORT (short status of hook, authority, platform fit, visuals), TOP IMPROVEMENTS (3 to 5 highest-impact), PREDICTED PERFORMANCE (clearly say this is an AI estimate, not a guarantee, with reasoning)."},
{id:"sumB",n:"Publishing Editor",s:CTX+"You prepare the final package. Labels: CHECKLIST (8 to 10 concrete pre-publish items), BEFORE VS AFTER (explain what changed between the original and rewritten caption and why it should perform better), FOLLOW-UP PROMPTS (5 prompts the creator can paste into Claude for deeper optimization)."}];
function log(t){var l=$("log");l.textContent+="["+new Date().toLocaleTimeString()+"] "+t+"\n";l.scrollTop=l.scrollHeight}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function chips(){var h=$("chips");h.textContent="";REV.concat(STAGE2,STAGE3).forEach(function(r){var d=document.createElement("div");d.className="chip "+(r.st||"");d.id="c-"+r.id;var a=document.createElement("span");a.className="dot";var b=document.createElement("span");b.textContent=r.n;var s=document.createElement("small");s.textContent=r.st==="run"?"working":r.st==="ok"?"done":r.st==="err"?"failed":"waiting";d.append(a,b,s);h.appendChild(d)})}
function setSt(r,s){r.st=s;chips()}
async function claude(sys,text,withImgs){
 for(var a=1;a<=3;a++){
  try{
   var c=[];if(withImgs)imgs.forEach(function(i){c.push({type:"text",text:"Image ("+i.type+"): "+i.name});c.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:i.data}})});
   c.push({type:"text",text:text});
   var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:MODEL,max_tokens:1000,system:sys,messages:[{role:"user",content:c}]})});
   if(!r.ok)throw new Error("HTTP "+r.status);
   var d=await r.json();var t=(d.content||[]).filter(function(b){return b.type==="text"}).map(function(b){return b.text}).join("\n");
   if(!t.trim())throw new Error("empty reply");return t;
  }catch(e){log("Attempt "+a+" failed: "+e.message);if(a===3)throw e;await sleep(1500*a)}
 }}
function parse(t){var o={},k="_";o[k]=[];t.split("\n").forEach(function(l){var m=l.replace(/\*\*/g,"").match(/^\s*#*\s*([A-Z][A-Z &\/-]+?)\s*:\s*(.*)$/);if(m&&SEC.indexOf(m[1])>-1){k=m[1];o[k]=[];if(m[2])o[k].push(m[2])}else o[k].push(l)});for(var x in o)o[x]=o[x].join("\n").trim();return o}
function num(s){var m=(s||"").match(/\d+/);return m?Math.min(100,+m[0]):null}
function ctxText(){return "CAPTION:\n"+($("cap").value.trim()||"(none provided)")+"\n\nCONTEXT / ANALYTICS NOTES:\n"+($("an").value.trim()||"(none)")+"\n\nImages attached: "+imgs.length}
function tone(){return {Gentle:"Review tone: gentle and encouraging. Lead with genuine positives, frame weaknesses as opportunities, stay kind but still specific and honest.",Balanced:"Review tone: balanced, honest with constructive tips.",Strict:"Review tone: strict professional critique.",Brutal:"Review tone: brutally honest, roast-level, no sugarcoating, but useful."}[$("tone").value]+" "}
async function runOne(r,input,withImgs){
 if(r.out&&r.st==="ok")return;setSt(r,"run");log(r.n+" started");
 try{r.out=await claude(tone()+r.s+FMT,input,withImgs);r.p=parse(r.out);setSt(r,"ok");log(r.n+" finished")}catch(e){setSt(r,"err");log(r.n+" failed after retries")}}
async function go(fresh){
 if(busy)return;
 if(!$("cap").value.trim()&&!imgs.length){$("msg").textContent="Add a caption or at least one image first.";return}
 busy=true;$("go").disabled=true;$("retry").classList.add("hid");$("msg").textContent="Analysis running...";
 var all=REV.concat(STAGE2,STAGE3);
 if(fresh)all.forEach(function(r){r.out=null;r.p=null;r.st=""});chips();
 var base=ctxText();
 var vis=REV.filter(function(r){return r.img});
 if(!imgs.length)vis.forEach(function(r){r.st="ok";r.p={SCORE:"",REASONING:"No images were uploaded."};r.skip=true});else vis.forEach(function(r){r.skip=false});
 chips();
 await Promise.all(REV.filter(function(r){return !r.skip}).map(function(r){return runOne(r,base,!!r.img)}));
 var panel=REV.filter(function(r){return r.out}).map(function(r){return "=== "+r.n+" ===\n"+r.out}).join("\n\n");
 var rew=STAGE2[0];await runOne(rew,base+"\n\nPANEL FINDINGS:\n"+panel,false);
 var pk=base+"\n\nPANEL FINDINGS:\n"+panel+"\n\nREWRITE:\n"+(rew.out||"(unavailable)");
 await Promise.all(STAGE3.map(function(r){return runOne(r,pk,false)}));
 render();busy=false;$("go").disabled=false;
 var failed=all.filter(function(r){return r.st==="err"}).length;
 $("msg").textContent=failed?failed+" reviewer(s) failed. Retry them without losing finished work.":"Analysis complete.";
 if(failed)$("retry").classList.remove("hid");
}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function body(txt){var f=document.createDocumentFragment();if(!txt){f.appendChild(el("p","note","Not available."));return f}
 var ul=null;txt.split("\n").forEach(function(l){var m=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);if(m){if(!ul){ul=el("ul");f.appendChild(ul)}ul.appendChild(el("li",null,m[1]))}else if(l.trim()){ul=null;f.appendChild(el("p",null,l.trim()))}});return f}
function card(title,txt,cls){var c=el("section","card "+(cls||""));c.appendChild(el("h3",null,title));c.appendChild(body(txt));return c}
function render(){
 var o=$("out");o.textContent="";o.classList.remove("hid");
 var A=(STAGE3[0].p)||{},B=(STAGE3[1].p)||{},R=(STAGE2[0].p)||{};
 var hero=el("section","card hero");var ring=el("div","ring");var in_=el("div",null,"--");ring.appendChild(in_);
 var hb=el("div");hb.appendChild(el("h2",null,"Executive summary"));hb.appendChild(body(A["EXECUTIVE SUMMARY"]));hero.append(ring,hb);o.appendChild(hero);
 var sc=num(A["OVERALL SCORE"]);if(sc!=null){in_.textContent=sc;ring.style.setProperty("--v",sc)}
 var bars=el("section","card");bars.appendChild(el("h3",null,"Category breakdown"));
 REV.forEach(function(r){var s=r.p?num(r.p.SCORE):null;if(s==null)return;var b=el("div","bar");var sp=el("span");sp.append(el("span",null,r.c),el("span",null,s+"/100"));var i=el("i"),f=el("b");i.appendChild(f);b.append(sp,i);bars.appendChild(b);setTimeout(function(){f.style.width=s+"%"},80)});
 o.appendChild(bars);
 var g=el("div","grid");o.appendChild(g);
 g.appendChild(card("Content health report",A["HEALTH REPORT"]));
 g.appendChild(card("Highest-impact improvements",A["TOP IMPROVEMENTS"],"hi"));
 REV.forEach(function(r){if(!r.p||r.skip)return;var w=el("section","card");w.appendChild(el("h3",null,r.n));
  [["AI reasoning","REASONING"],["Strengths","STRENGTHS","good"],["Weaknesses","WEAKNESSES","bad"],["Missed opportunities","MISSED OPPORTUNITIES"],[r.id==="alg"?"Platform-specific recommendations":"Recommendations","RECOMMENDATIONS"]].forEach(function(x){if(r.p[x[1]]){var d=el("div",x[2]||"");d.style.padding="0 0 0 10px";d.style.margin="10px 0";d.appendChild(el("b",null,x[0]));d.appendChild(body(r.p[x[1]]));w.appendChild(d)}});g.appendChild(w)});
 var rw=el("section","card good");rw.appendChild(el("h3",null,"Rewritten caption"));var pre=el("p",null,R["REWRITTEN CAPTION"]||"Not available.");rw.appendChild(pre);
 var cp=el("button",null,"Copy caption");cp.onclick=function(){navigator.clipboard.writeText(pre.textContent).then(function(){cp.textContent="Copied"},function(){cp.textContent="Copy failed"})};rw.appendChild(cp);g.appendChild(rw);
 g.appendChild(card("Alternative hooks",R["ALTERNATIVE HOOKS"]));g.appendChild(card("Alternative titles",R["ALTERNATIVE TITLES"]));
 var ck=el("section","card");ck.appendChild(el("h3",null,"Publishing checklist"));
 (B["CHECKLIST"]||"").split("\n").forEach(function(l){var t=l.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,"").trim();if(!t)return;var d=el("label","ck");d.style.margin="5px 0";var c=document.createElement("input");c.type="checkbox";d.append(c,el("span",null,t));ck.appendChild(d)});g.appendChild(ck);
 var pf=card("Predicted performance potential",A["PREDICTED PERFORMANCE"]);pf.appendChild(el("p","note","AI estimate only. Real results depend on audience, timing and distribution."));g.appendChild(pf);
 var ba=el("section","card");ba.appendChild(el("h3",null,"Before vs after"));var bx=el("div","ba");var b1=el("div"),b2=el("div");b1.append(el("b",null,"Before\n"),document.createTextNode("\n"+($("cap").value.trim()||"(image only)")));b2.append(el("b",null,"After\n"),document.createTextNode("\n"+(R["REWRITTEN CAPTION"]||"Not available")));bx.append(b1,b2);ba.appendChild(bx);ba.appendChild(body(B["BEFORE VS AFTER"]));o.appendChild(ba);
 var fp=el("section","card");fp.appendChild(el("h3",null,"Go deeper with these prompts"));
 (B["FOLLOW-UP PROMPTS"]||"").split("\n").forEach(function(l){var t=l.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,"").replace(/^["“]|["”]$/g,"").trim();if(!t)return;var b=el("button","pr",t);b.title="Click to copy";b.onclick=function(){navigator.clipboard.writeText(t).then(function(){b.textContent="Copied: "+t},function(){})};fp.appendChild(b)});o.appendChild(fp);
 o.scrollIntoView({behavior:"smooth"});
}
function addFiles(fs){Array.prototype.slice.call(fs).forEach(function(f){if(imgs.length>=6||!/^image\//.test(f.type))return;
 var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);var u=cv.toDataURL("image/jpeg",.85);imgs.push({name:f.name,type:"post image",url:u,data:u.split(",")[1]});thumbs()};im.onerror=function(){log("Could not read "+f.name)};im.src=fr.result};fr.readAsDataURL(f)})}
function thumbs(){var t=$("thumbs");t.textContent="";imgs.forEach(function(i,n){var d=el("div","th");var im=document.createElement("img");im.src=i.url;im.alt=i.name;var s=document.createElement("select");["post image","carousel slide","thumbnail","analytics screenshot"].forEach(function(o){var op=el("option",null,o);if(o===i.type)op.selected=true;s.appendChild(op)});s.onchange=function(){i.type=s.value};var b=el("button",null,"Remove");b.onclick=function(){imgs.splice(n,1);thumbs()};d.append(im,s,b);t.appendChild(d)})}
$("drop").onclick=function(){$("file").click()};$("drop").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click()}};
$("file").onchange=function(e){addFiles(e.target.files);e.target.value=""};
$("drop").ondragover=function(e){e.preventDefault()};$("drop").ondrop=function(e){e.preventDefault();addFiles(e.dataTransfer.files)};
$("go").onclick=function(){go(true)};$("retry").onclick=function(){go(false)};
$("tg").onclick=function(){var r=document.documentElement;r.dataset.t=r.dataset.t==="light"?"dark":"light"};
chips();log("Ready. Add your content and run the analysis.");
</script></body></html>
