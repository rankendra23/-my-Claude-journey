<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cognitive Pattern Explorer</title>
<style>
:root{--bg1:#0e1a2b;--bg2:#183049;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.16);--tx:#eaf2f8;--mu:#a3b8c9;--ac:#7fd6c2;--ac2:#8fb4ff;--ink:#0b1622}
body.stress{--bg1:#241520;--bg2:#3b2231;--ac:#ffb48a;--ac2:#ff8fa3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;transition:background .8s}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.22;pointer-events:none;animation:fl 18s ease-in-out infinite alternate;transition:background .8s}
.o1{width:320px;height:320px;background:var(--ac);top:-90px;left:-70px}
.o2{width:400px;height:400px;background:var(--ac2);bottom:-140px;right:-90px;animation-delay:-7s}
@keyframes fl{to{transform:translate(50px,35px) scale(1.15)}}
main{position:relative;max-width:780px;margin:0 auto;padding:18px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--mu)}
#steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
#steps li{padding:2px 10px;border-radius:99px;border:1px solid var(--bd);transition:.4s}
#steps li.c{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:600}
#steps li.d{color:var(--ac);border-color:var(--ac)}
.bar{height:6px;border-radius:9px;background:var(--card);margin:10px 0 22px;overflow:hidden}
#fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .7s ease}
#app{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:26px 22px;backdrop-filter:blur(8px);opacity:0;transform:translateY(10px)}
#app.in{opacity:1;transform:none;transition:opacity .6s,transform .6s}
h1,h2{margin:.2em 0 .4em;line-height:1.2;font-weight:650;outline:none}
h1{font-size:clamp(1.8rem,5vw,2.6rem)}h2{font-size:clamp(1.3rem,4vw,1.8rem)}
p{margin:.5em 0}.eyebrow{color:var(--ac);text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;margin:0}
.mu{color:var(--mu);font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--ink);border:0;border-radius:12px;padding:12px 22px;font-weight:650;margin-top:14px;transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd);margin-left:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0 4px}
.mode,.opt{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;transition:.25s}
.mode:hover,.opt:hover{border-color:var(--ac);transform:translateY(-2px)}
.mode[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.opts{display:grid;gap:10px;margin-top:14px}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.tbar{height:4px;background:var(--card);border-radius:9px;overflow:hidden;margin:12px 0}
.tbar i{display:block;height:100%;background:var(--ac);animation:tb 12s linear forwards}
@keyframes tb{from{width:100%}to{width:0}}
#list{display:grid;gap:10px;margin:16px 0 0;padding:0;list-style:none}
#list.tl{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.card{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--bd);background:var(--card);border-radius:14px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:border-color .2s,transform .2s}
.tl .card{flex-direction:column;text-align:center;min-height:110px;justify-content:center}
.card:hover{border-color:var(--ac)}.card.drag{opacity:.35}.card.over{outline:2px dashed var(--ac)}
.card b{background:var(--ac);color:var(--ink);border-radius:50%;min-width:28px;height:28px;display:grid;place-items:center;font-size:.85rem}
.row{margin:12px 0}.row .l{display:flex;justify-content:space-between;font-size:.92rem}
.row .t{height:12px;background:var(--card);border-radius:9px;overflow:hidden;margin-top:4px}
.row .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.2);color:var(--tx);padding:12px;font:inherit;resize:vertical}
.note{border-left:3px solid var(--ac);padding:2px 14px;margin:14px 0;background:rgba(255,255,255,.04);border-radius:0 10px 10px 0}
.sr{position:absolute;left:-9999px}
footer{margin-top:18px;font-size:.78rem;color:var(--mu);text-align:center}
@media(max-width:520px){#app{padding:20px 14px}.btn.ghost{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#app{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="orb o1" aria-hidden="true"></div><div class="orb o2" aria-hidden="true"></div>
<main>
  <div class="top"><span>Cognitive Pattern Explorer</span>
    <ol id="steps" aria-label="Progress"><li>Start</li><li>Discover</li><li>Priorities</li><li>Map</li><li>Reflect</li></ol></div>
  <div class="bar" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
  <section id="app" aria-live="off"></section>
  <footer>Educational and reflective only. This is not a diagnosis or clinical assessment, and nothing is stored or sent anywhere.</footer>
  <div id="live" class="sr" aria-live="polite"></div>
</main>
<script>
"use strict";
/* ---------- DATA ---------- */
const STY={
 A:{n:"Analytical Thinker",d:"you often look for facts, structure and clear reasoning before you commit. This suggests you value understanding why something is true.",t:"Notice moments when 'one more piece of data' is really a way to delay a feeling-based choice."},
 E:{n:"Emotional Intuitive",d:"you often tune in to how a situation feels, for you and for the people involved. This suggests you read atmosphere and relationships quickly.",t:"Try pairing your gut sense with one concrete fact, so your intuition has something to stand on."},
 O:{n:"Overthinking Loop Style",d:"you often replay possibilities and 'what ifs' to avoid mistakes. This suggests you care deeply about getting things right.",t:"A small time-box (say, ten minutes of thinking, then one tiny step) can turn loops into movement."},
 X:{n:"Action-First Decision Maker",d:"you often move first and learn on the way. This suggests you trust momentum and feedback from doing.",t:"A brief pause to ask 'what would I regret not checking?' can make quick moves even stronger."},
 B:{n:"Balanced Reflective Thinker",d:"you often weigh several angles and adjust to the situation. This suggests flexibility between head, heart and action.",t:"Notice when balance becomes hesitation, and let one angle lead once you have enough."}};
const CH1=[
 {t:"The unexpected invitation",p:"A friend invites you to something tonight, and your plans were open. What happens in your mind first?",o:[["I check the details: who, where, how long, is it worth it?","A"],["I picture the mood and how I'd feel there.","E"],["I imagine what could go awkward and play it out a few times.","O"],["I say yes, I'll figure out the rest on the way.","X"],["I glance at my energy and my plans, then decide.","B"]]},
 {t:"A new skill to learn",p:"You want to learn something new. Where do you begin?",o:[["I research the best path and build a plan.","A"],["I follow what excites me today.","E"],["I read 'one more' guide in case I choose wrong.","O"],["I start a small project straight away.","X"],["I try a bit, then adjust my approach.","B"]]},
 {t:"A message left on 'seen'",p:"Someone hasn't replied to an important message for a day. What does your mind do?",o:[["I think of the likely practical reasons.","A"],["I notice the uneasy feeling and wonder how they feel.","E"],["I re-read my message and replay what I might have said wrong.","O"],["I send a short follow-up or call.","X"],["I give it time, but plan a gentle check-in.","B"]]},
 {t:"The fork in the road",p:"Two options both look good, and you need to choose by tomorrow.",o:[["I compare them side by side on the things that matter.","A"],["I notice which one my gut leans toward.","E"],["I keep finding new risks in each, and it feels hard to close.","O"],["I pick one now and adapt later.","X"],["I list pros and cons, then check how each one feels.","B"]]},
 {t:"After a small mistake",p:"You slipped up on something minor. What does your reflection sound like?",o:[["What exactly caused it, and how do I prevent it?","A"],["I feel it first, and I need a moment to settle.","E"],["My mind returns to it again and again.","O"],["Fixed it, next thing.","X"],["I learn something, be kind to myself, and move on.","B"]]}];
const PRI=[
 {t:"Understanding the facts",k:"A"},{t:"Feeling at ease and connected",k:"E"},{t:"Getting it exactly right",k:"O"},
 {t:"Making visible progress",k:"X"},{t:"Staying flexible and fair",k:"B"},{t:"Having a clear plan",k:"A"}];
const STEPS=[
 {t:"Gather information",k:"A"},{t:"Check how it feels",k:"E"},{t:"Replay what could go wrong",k:"O"},
 {t:"Take a first step",k:"X"},{t:"Pause and weigh both sides",k:"B"}];
const CH3=[
 {t:"A big change arrives",p:"Drag these into the order your mind usually moves through them, earliest to latest."},
 {t:"A disagreement with someone close",p:"Arrange the steps in the order you often take them, earliest to latest."}];
const W2=[3,2,1,.5,0,0],W3=[3,2,1,.5,0],TOTAL=8,LIMIT=12000;

/* ---------- STATE / HELPERS ---------- */
const $=s=>document.querySelector(s),app=$("#app");
let st,timer;
const fresh=()=>{st={stress:false,done:0,sc:{A:0,E:0,O:0,X:0,B:0}}};
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bar(cur){
  $("#fill").style.width=(st.done/TOTAL*100)+"%";
  $(".bar").setAttribute("aria-valuenow",Math.round(st.done/TOTAL*100));
  document.querySelectorAll("#steps li").forEach((l,i)=>{l.className=i<cur?"d":i===cur?"c":"";i===cur?l.setAttribute("aria-current","step"):l.removeAttribute("aria-current")});
}
function show(html){
  clearTimeout(timer);app.classList.remove("in");void app.offsetWidth;
  app.innerHTML=html;app.classList.add("in");
  const h=app.querySelector("h1,h2");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}
  window.scrollTo({top:0,behavior:window.matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
}

/* ---------- REUSABLE DRAG & DROP (native + touch + keyboard) ---------- */
function sortable(host,arr,onChange){
  let from=null;
  function move(a,b){
    if(a==null||a===b||b<0||b>=arr.length)return;
    const [x]=arr.splice(a,1);arr.splice(b,0,x);draw(b);
    $("#live").textContent=x.t+" moved to position "+(b+1)+" of "+arr.length;
    onChange&&onChange();
  }
  function draw(focus){
    host.innerHTML="";
    arr.forEach((it,i)=>{
      const li=document.createElement("li");
      li.className="card";li.tabIndex=0;li.draggable=true;
      li.setAttribute("aria-label",it.t+", position "+(i+1)+" of "+arr.length+". Use arrow keys to move.");
      li.innerHTML="<b>"+(i+1)+"</b><span>"+esc(it.t)+"</span>";
      li.addEventListener("dragstart",e=>{from=i;li.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(i))});
      li.addEventListener("dragend",()=>{li.classList.remove("drag");host.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))});
      li.addEventListener("dragover",e=>{e.preventDefault();li.classList.add("over")});
      li.addEventListener("dragleave",()=>li.classList.remove("over"));
      li.addEventListener("drop",e=>{e.preventDefault();move(from,i);from=null});
      li.addEventListener("keydown",e=>{
        if(["ArrowUp","ArrowLeft"].includes(e.key)){e.preventDefault();move(i,i-1)}
        else if(["ArrowDown","ArrowRight"].includes(e.key)){e.preventDefault();move(i,i+1)}
      });
      /* touch fallback */
      li.addEventListener("touchstart",()=>{from=i;li.classList.add("drag")},{passive:true});
      li.addEventListener("touchmove",e=>{
        e.preventDefault();const t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY);
        host.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));
        const c=el&&el.closest&&el.closest(".card");if(c&&host.contains(c))c.classList.add("over");
      },{passive:false});
      li.addEventListener("touchend",e=>{
        const t=e.changedTouches[0],el=document.elementFromPoint(t.clientX,t.clientY),c=el&&el.closest&&el.closest(".card");
        li.classList.remove("drag");
        if(c&&host.contains(c)){move(from,[...host.children].indexOf(c))}else draw();
        from=null;
      });
      host.appendChild(li);
    });
    if(focus!=null)host.children[focus].focus();
  }
  draw();
}

/* ---------- SCREENS ---------- */
function start(){
  fresh();document.body.classList.remove("stress");bar(0);
  show(`<p class="eyebrow">A gentle exploration</p><h1>Cognitive Pattern Explorer</h1>
  <p>Explore how you tend to think through everyday moments. There are no right answers, only patterns worth noticing.</p>
  <p class="mu">Choose the atmosphere for your journey:</p>
  <div class="modes" role="group" aria-label="Mode">
   <button class="mode" data-m="c" aria-pressed="true"><b>🌿 Calm Mode</b><br><span class="mu">No timers. Take all the time you like.</span></button>
   <button class="mode" data-m="s" aria-pressed="false"><b>🌪 Stress Mode</b><br><span class="mu">A soft countdown adds light pressure. Nothing is penalised.</span></button></div>
  <button class="btn" id="go">Begin Chapter 1</button>`);
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
    st.stress=b.dataset.m==="s";document.body.classList.toggle("stress",st.stress);
    app.querySelectorAll(".mode").forEach(x=>x.setAttribute("aria-pressed",x===b));
  });
  $("#go").onclick=()=>ch1(0);
}
function ch1(i){
  if(i>=CH1.length)return ch2();
  const q=CH1[i];bar(1);
  show(`<p class="eyebrow">Chapter 1 · Discover Your Thinking Style · ${i+1} of ${CH1.length}</p><h2>${q.t}</h2><p>${q.p}</p>
  ${st.stress?'<div class="tbar" aria-hidden="true"><i></i></div><p class="mu" id="hint" aria-live="polite">A soft timer is running. No rush, it just notices your pace.</p>':""}
  <div class="opts">${shuffle(q.o).map(o=>`<button class="opt" data-k="${o[1]}">${esc(o[0])}</button>`).join("")}</div>`);
  const t0=performance.now();let late=false;
  if(st.stress)timer=setTimeout(()=>{late=true;const h=$("#hint");if(h)h.textContent="The timer has ended. Take your moment, there's no penalty."},LIMIT);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    st.sc[b.dataset.k]+=3;
    if(st.stress){const dt=(performance.now()-t0)/1000;if(late)st.sc.O+=.5;else if(dt<5)st.sc.X+=.5}
    st.done++;ch1(i+1);
  });
}
function ch2(){
  bar(2);const list=shuffle(PRI);
  show(`<p class="eyebrow">Chapter 2 · Choose Your Priorities</p><h2>What matters most when you decide?</h2>
  <p>Drag the cards so your top priority is first. Keyboard: focus a card and use the arrow keys.</p>
  <ol id="list"></ol><button class="btn" id="nx">Continue to Chapter 3</button>`);
  sortable($("#list"),list);
  $("#nx").onclick=()=>{list.forEach((c,i)=>st.sc[c.k]+=W2[i]);st.done++;ch3(0)};
}
function ch3(i){
  if(i>=CH3.length)return end();
  const s=CH3[i],list=shuffle(STEPS);bar(3);
  show(`<p class="eyebrow">Chapter 3 · Map Your Thinking · ${i+1} of ${CH3.length}</p><h2>${s.t}</h2><p>${s.p}</p>
  <p class="mu">← earliest &nbsp;·&nbsp; latest →</p><ol id="list" class="tl"></ol><button class="btn" id="nx">${i+1<CH3.length?"Next timeline":"See my reflection"}</button>`);
  sortable($("#list"),list);
  $("#nx").onclick=()=>{list.forEach((c,j)=>st.sc[c.k]+=W3[j]);st.done++;ch3(i+1)};
}
function pct(){
  const tot=Object.values(st.sc).reduce((a,b)=>a+b,0)||1,keys=Object.keys(st.sc);
  const p={};keys.forEach(k=>p[k]=Math.round(st.sc[k]/tot*100));
  const diff=100-keys.reduce((a,k)=>a+p[k],0),top=keys.reduce((a,b)=>p[b]>p[a]?b:a);
  p[top]+=diff;return p;
}
function end(){
  st.done=TOTAL;bar(4);
  const p=pct(),r=Object.keys(p).sort((a,b)=>p[b]-p[a]),a=STY[r[0]],b=STY[r[1]];
  show(`<p class="eyebrow">Final Reflection Journal</p><h2>Your thinking landscape</h2>
  <p>In these scenarios, ${a.d}</p>
  <p>You also showed a lean toward <b>${b.n}</b>, so your patterns are likely a blend that shifts with context.</p>
  <div role="list" aria-label="Percentage breakdown">${r.map(k=>`<div class="row" role="listitem"><div class="l"><span>${STY[k].n}</span><span>${p[k]}%</span></div><div class="t"><i data-w="${p[k]}"></i></div></div>`).join("")}</div>
  <div class="note"><b>A gentle experiment:</b> ${a.t}</div>
  <p><b>Journal prompts</b></p>
  <ul><li>When did my thinking feel most natural in these scenes?</li><li>Where might another style help me?</li><li>What is one small thing I'd like to try this week?</li></ul>
  <label class="sr" for="jn">Your journal</label><textarea id="jn" placeholder="Write whatever comes to mind..."></textarea>
  <button class="btn" id="dl">Download my reflection</button><button class="btn ghost" id="rs">Explore again</button>
  <p class="mu">These results describe patterns in a few playful choices today. They are not a diagnosis, and they can change with mood, context and experience.</p>`);
  requestAnimationFrame(()=>setTimeout(()=>app.querySelectorAll(".t i").forEach(i=>i.style.width=i.dataset.w+"%"),80));
  $("#rs").onclick=start;
  $("#dl").onclick=()=>{
    const txt="Cognitive Pattern Explorer\n\n"+r.map(k=>STY[k].n+": "+p[k]+"%").join("\n")+"\n\nMy notes:\n"+$("#jn").value+"\n\n(Educational and reflective only. Not a diagnosis.)";
    const u=URL.createObjectURL(new Blob([txt],{type:"text/plain"})),l=document.createElement("a");
    l.href=u;l.download="my-reflection.txt";l.click();setTimeout(()=>URL.revokeObjectURL(u),500);
  };
}
start();
</script>
</body>
</html>
